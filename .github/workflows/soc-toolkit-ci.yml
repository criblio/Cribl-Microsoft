name: SOC Toolkit CI

on:
  pull_request:
    paths:
      - 'soc-optimizationtoolkit/**'
  push:
    branches:
      - main
    paths:
      - 'soc-optimizationtoolkit/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soc-optimizationtoolkit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The release-drift check counts source commits landed since the
          # release tarball last changed. A shallow clone has no history to
          # count, and the check reports that as unmeasured rather than as zero -
          # so the full history is what makes its warning mean anything.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soc-optimizationtoolkit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # DBT-61. The Listing type is the real guard - it runs in Typecheck
      # above. This catches only the escape hatch the type cannot close:
      # counting an unwrapped listing.
      - name: Check listings
        run: npm run check-listings --workspace apps/cribl-app

      # DBT-67. The extractor that generates a committed core asset crashed for
      # seven weeks and nothing reported it, because no test ran it and no gate
      # called it. This runs it.
      - name: Check schema asset
        run: npm run check-schema-asset --workspace apps/cribl-app

      # DBT-100. An element whose every class name resolves to no rule renders
      # unstyled in SILENCE - nothing throws, no test fails, the screen just
      # looks plain. It happened twice and both were found by hand months later.
      # Narrowed to that case on purpose: asking the same question one class
      # name at a time reported 36 findings of which 21 named elements a sibling
      # class already styled, and this gate would have failed on its first run.
      #
      # FOURTEEN elements survive that narrowing, recorded in UNDECIDED_BARE as
      # THIRTEEN path-plus-name entries - `gap-overflow-triage` is bare at two
      # lines of one file. Both numbers, because they are not the same number:
      # an earlier draft of this comment said only "13" and claimed the gate
      # fails on the fourteenth, and the fourteenth already existed and passed.
      # Entries carry no line - a line moves on any edit above it - so each one
      # carries an EXACT COUNT instead, and a further bare element under a
      # recorded name fails the step rather than joining the record.
      - name: Check class names
        run: npm run check-classnames --workspace apps/cribl-app

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails when package.json, package-lock.json, release/, release-notes.md
      # and backlog.md stop agreeing on which version is current; warns, never
      # fails, when source has landed since that version was packaged. The lock
      # is the one held to package.json rather than to the tarball, since npm
      # copies that field verbatim. See backlog.md item 8.
      - name: Check release drift
        run: npm run check-release --workspace apps/cribl-app

      # DOCS AS CODE. Fails when a Living or Proposed document names a path that
      # was deleted, points at a file that is not there, or is a plan nobody has
      # re-read inside the window - and when an accepted ADR does not say which
      # documents it invalidated. The audit of 2026-08-26 found nine documents
      # asserting things the repo had already disproved, one of them an unbuilt
      # plan still instructing a build for a shell removed six weeks earlier.
      # Every one of those states fails here now.
      - name: Check docs drift
        run: npm run check-docs --workspace apps/cribl-app

      # The board is DATA: docs/board.json is the source and docs/board.md is
      # generated from it. This validates the data - ids, epics, the
      # settled/undecided distinction, and the dependency graph including cycles
      # and work started before its blocker - and fails if the rendered board is
      # out of date, so the two cannot disagree.
      - name: Check board
        run: npm run check-board --workspace apps/cribl-app

      # check-board proves board.md matches board.json and that the data is
      # coherent. Neither says the board still DESCRIBES the repo, and that gap
      # was covered only by a Claude Code stop hook - which fires for whoever
      # has hooks enabled and for nobody else. This is the same rule where
      # everyone meets it.
      #
      # A WARNING, deliberately: a change can legitimately touch source without
      # moving a card, and a check that blocks on judgement gets routed around.
      # What it must not be is silent.
      - name: Check board freshness
        if: github.event_name == 'pull_request'
        run: npm run check-board-freshness --workspace apps/cribl-app
